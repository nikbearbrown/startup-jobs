name: Validate data
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 tests/test-build.py
      - run: python3 scripts/build.py
      - run: git diff --exit-code -- data/companies.json data/companies.csv data/coverage.json
